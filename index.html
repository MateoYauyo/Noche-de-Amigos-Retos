        }

            color: var(--text);

            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 950px;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 2.3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .step-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        /* Botones generales */
        .btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            margin: 5px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #64748b;
            box-shadow: none;
        }
        .btn-secondary:hover { background-color: #475569; }

        .btn-auto {
            background-color: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-auto:hover { background-color: #059669; }

        /* Lista de Niveles en Portada */
        .levels-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .level-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-btn:hover {
            border-color: var(--accent);
            transform: translateX(5px);
            background: #1e293b;
        }

        .level-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #334155;
            color: #cbd5e1;
        }

        /* Selector Verdad/Reto en Nivel 3 */
        .sub-type-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .sub-type-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sub-type-btn.active {
            border-color: var(--accent);
            background: var(--accent);
        }

        /* Banner del Tablero */
        .level-header {
            background: linear-gradient(90deg, #831843, #500724);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #9d174d;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Cuadrícula de Cajas */
        .grid-boxes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .box {
            background: linear-gradient(135deg, #6366f1, #4338ca);
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s;
            user-select: none;
            border: 2px solid #818cf8;
        }

        .box:hover:not(.opened) {
            transform: translateY(-4px) rotate(2deg);
            border-color: #c7d2fe;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.4);
        }

        .box.opened {
            background: #1e293b;
            border-color: #334155;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--accent);
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: popIn 0.3s ease-out;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.3);
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f472b6;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin: 25px 0;
            line-height: 1.4;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-footer {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 15px;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>

            grid.appendChild(box);
        });
    }

    function openBox(index) {
        const states = getCurrentStates();
        if (states[index]) return; // Si ya está abierta, no hace nada

        states[index] = true; // Guardar estado en el registro persistente
        const boxElem = document.getElementById(`box-${index}`);
        boxElem.classList.add('opened');
        boxElem.innerText = '📦';

        // Título del modal
        let titleText = levelNames[currentLevel];
        if (currentLevel === 3) {
            titleText += ` (${currentNivel3Subtype.toUpperCase()})`;
        }

        document.getElementById('modalTitle').innerText = titleText;
        document.getElementById('modalText').innerText = `"${currentCards[index]}"`;
        document.getElementById('modalBoxNum').innerText = `Caja N° ${index + 1}`;

        document.getElementById('prizeModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('prizeModal').style.display = 'none';

        const states = getCurrentStates();
        if (!states.includes(false)) {
            alert('¡Han completado todas las cajas de esta categoría!');
        }
    }

    function pickRandomBox() {
        const states = getCurrentStates();
        let closedIndexes = [];
        states.forEach((isOpen, index) => {
            if (!isOpen) closedIndexes.push(index);
        });

        if (closedIndexes.length === 0) {
            alert('¡Todas las cajas de esta categoría están abiertas!');
            return;
        }

        let turns = 0;
        const interval = setInterval(() => {
            const tempIndex = closedIndexes[Math.floor(Math.random() * closedIndexes.length)];
            const tempBox = document.getElementById(`box-${tempIndex}`);
            
            tempBox.style.borderColor = '#ec4899';
            setTimeout(() => { 
                if(!states[tempIndex]) tempBox.style.borderColor = '#818cf8'; 
            }, 80);
            
            turns++;
            if (turns > 12) {
                clearInterval(interval);
                const finalIndex = closedIndexes[Math.floor(Math.random() * closedIndexes.length)];
                openBox(finalIndex);
            }
        }, 100);
    }

    // Inicializar los estados de las cajas al cargar la aplicación
    resetAllBoxStates();
</script>

</body>
</html>
